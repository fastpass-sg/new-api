# http-level directives shared by every server block.
#
# These live here rather than in new-api.conf because `map` and `upstream` may
# appear only once per name. Leaving them in a rendered per-domain file means
# the second rendered file redefines them and nginx refuses to start.
#
# This file is committed as-is: it has no template variables.
#
# Logto's upstreams are deliberately NOT here. nginx resolves upstream hostnames
# at startup and dies if one cannot be resolved, so a `logto` upstream declared
# while the container is disabled would take the whole site down. Each Logto
# upstream is declared in its own rendered server file instead, and deploy.sh
# renders those only when LOGTO_ENABLED=true.

# Maps client Connection/Upgrade headers to what we should send upstream:
#   WebSocket request (Upgrade present) → Connection: upgrade
#   Regular HTTP                        → Connection: "" (let nginx pool it)
# Required for `keepalive` in the upstream blocks to actually work.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# Upstream keepalive: keep up to 100 idle connections to new-api per worker.
# Cuts TCP handshake overhead and prevents TIME_WAIT accumulation under load.
upstream new_api_backend {
    server new-api:3000;
    keepalive 100;
    keepalive_requests 10000;
    keepalive_timeout  60s;
}
